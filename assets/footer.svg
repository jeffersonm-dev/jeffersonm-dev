<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%" height="100" fill="none">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0d1524" />
    </linearGradient>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#00F7A7" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .footer-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #94a3b8; }
    .footer-bold { font-weight: 700; fill: #00F7A7; }
    .footer-sub { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #64748b; }
  </style>

  <rect width="900" height="100" rx="12" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.2" />

  <text x="450" y="44" text-anchor="middle" class="footer-text">
    Construyendo software con <tspan class="footer-bold">Arquitectura Sólida</tspan> &amp; <tspan class="footer-bold">Aseguramiento de Calidad</tspan>
  </text>
  <text x="450" y="68" text-anchor="middle" class="footer-sub">
    Jefferson Martínez • Full Stack Developer &amp; QA • Venezuela 🇻🇪
  </text>
</svg>
