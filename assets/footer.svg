<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 110" width="100%" height="110" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#07151a" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#00F7A7" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ambient Glow -->
    <filter id="glowFooter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .footer-quote { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #cbd5e1; letter-spacing: -0.2px; }
    .footer-highlight { font-weight: 700; fill: #00F7A7; }
    .footer-sub { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #64748b; letter-spacing: 0.5px; }
  </style>

  <!-- Ambient Glow -->
  <circle cx="470" cy="55" r="90" fill="#00F7A7" opacity="0.05" filter="url(#glowFooter)" />

  <!-- Base Card -->
  <rect width="940" height="110" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.4" />

  <!-- Content -->
  <g transform="translate(470, 48)">
    <text text-anchor="middle" class="footer-quote">
      Transformando requisitos en <tspan class="footer-highlight">Arquitectura Escalable</tspan> &amp; software <tspan class="footer-highlight">100% Verificado</tspan>
    </text>
  </g>

  <g transform="translate(470, 78)">
    <text text-anchor="middle" class="footer-sub">
      Jefferson Martínez • Full Stack Developer &amp; QA Software Tester • Venezuela 🇻🇪 ➔ Remoto Global
    </text>
  </g>
</svg>
