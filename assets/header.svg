<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Deep Navy/Cyber Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#07151a" />
    </linearGradient>

    <!-- Animated Neon Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7A7">
        <animate attributeName="stop-color" values="#00F7A7;#38BDF8;#818CF8;#00F7A7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#00F7A7;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F7A7">
        <animate attributeName="stop-color" values="#00F7A7;#38BDF8;#818CF8;#00F7A7" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Gradient for Text Highlights -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#00F7A7" />
    </linearGradient>

    <!-- Neon Mint Gradient for Tech Highlights -->
    <linearGradient id="mintSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7A7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1e293b" opacity="0.65" />
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); letter-spacing: -0.8px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; font-size: 17px; fill: #94a3b8; }
    .badge-text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00F7A7; letter-spacing: 0.5px; }
    .pill-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .code-accent { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; fill: #38bdf8; font-weight: 600; }
    .mono-accent { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #64748b; }
  </style>

  <!-- Card Background -->
  <rect width="940" height="260" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />
  <rect width="940" height="260" rx="18" fill="url(#dotGrid)" />

  <!-- Ambient Pulsing Glow Orbs -->
  <circle cx="860" cy="50" r="130" fill="#00F7A7" opacity="0.09" filter="url(#glow)">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="220" r="110" fill="#38BDF8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="30" r="90" fill="#818CF8" opacity="0.05" filter="url(#glow)" />

  <!-- Decorative Animated Wave Lines in Background -->
  <g opacity="0.32">
    <path d="M 620,190 C 690,110 750,250 830,150 C 870,100 910,130 940,90" fill="none" stroke="#00F7A7" stroke-width="2" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 640,210 C 710,130 770,270 850,170 C 890,120 930,150 960,110" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 600,170 C 670,90 730,230 810,130 C 850,80 890,110 920,70" fill="none" stroke="#818CF8" stroke-width="1" />
  </g>

  <!-- Status Pill (Top Left): Live Pulsing Available for Work -->
  <g transform="translate(50, 36)">
    <rect width="195" height="28" rx="14" fill="#042f1a" stroke="#00F7A7" stroke-width="1.2" opacity="0.95" />
    <!-- Pulsing Radar Ring -->
    <circle cx="16" cy="14" r="6" fill="none" stroke="#00F7A7" stroke-width="1.5" opacity="0.7">
      <animate attributeName="r" values="3;9" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Solid Dot -->
    <circle cx="16" cy="14" r="4" fill="#00F7A7" />
    <text x="30" y="18" class="badge-text">DISPONIBLE / OPEN TO WORK</text>
  </g>

  <!-- Tag Accent -->
  <g transform="translate(260, 36)">
    <text x="0" y="19" class="code-accent">&lt;fullstack-qa&gt;</text>
  </g>

  <!-- Main Name Title with animated cursor -->
  <g transform="translate(50, 118)">
    <text x="0" y="0" class="title">Jefferson Martínez</text>
    <rect x="428" y="-34" width="3" height="40" fill="#00F7A7">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Subtitle with dynamic emphasis -->
  <g transform="translate(50, 150)">
    <text x="0" y="0" class="subtitle">Full Stack Developer &amp; QA Software Tester • Arquitectura .NET &amp; Frontend Moderno</text>
  </g>

  <!-- Tech Pills Row with sleek border highlights -->
  <g transform="translate(50, 180)">
    <!-- Pill 1: .NET Core -->
    <g transform="translate(0, 0)">
      <rect width="96" height="30" rx="7" fill="#131d31" stroke="#512BD4" stroke-width="1.2" />
      <circle cx="13" cy="15" r="4" fill="#512BD4" />
      <text x="56" y="20" text-anchor="middle" class="pill-text">.NET Core</text>
    </g>

    <!-- Pill 2: C# -->
    <g transform="translate(104, 0)">
      <rect width="60" height="30" rx="7" fill="#131d31" stroke="#239120" stroke-width="1.2" />
      <circle cx="13" cy="15" r="4" fill="#239120" />
      <text x="36" y="20" text-anchor="middle" class="pill-text">C#</text>
    </g>

    <!-- Pill 3: Vue.js 3 -->
    <g transform="translate(172, 0)">
      <rect width="90" height="30" rx="7" fill="#131d31" stroke="#4FC08D" stroke-width="1.2" />
      <circle cx="13" cy="15" r="4" fill="#4FC08D" />
      <text x="52" y="20" text-anchor="middle" class="pill-text">Vue.js 3</text>
    </g>

    <!-- Pill 4: Angular -->
    <g transform="translate(270, 0)">
      <rect width="88" height="30" rx="7" fill="#131d31" stroke="#DD0031" stroke-width="1.2" />
      <circle cx="13" cy="15" r="4" fill="#DD0031" />
      <text x="51" y="20" text-anchor="middle" class="pill-text">Angular</text>
    </g>

    <!-- Pill 5: SQL Server -->
    <g transform="translate(366, 0)">
      <rect width="102" height="30" rx="7" fill="#131d31" stroke="#CC2927" stroke-width="1.2" />
      <circle cx="13" cy="15" r="4" fill="#CC2927" />
      <text x="58" y="20" text-anchor="middle" class="pill-text">SQL Server</text>
    </g>

    <!-- Pill 6: Swagger/API -->
    <g transform="translate(476, 0)">
      <rect width="88" height="30" rx="7" fill="#131d31" stroke="#85EA2D" stroke-width="1.2" />
      <circle cx="13" cy="15" r="4" fill="#85EA2D" />
      <text x="51" y="20" text-anchor="middle" class="pill-text">Swagger</text>
    </g>

    <!-- Pill 7: QA & Testing -->
    <g transform="translate(572, 0)">
      <rect width="98" height="30" rx="7" fill="#131d31" stroke="#00F7A7" stroke-width="1.2" />
      <circle cx="13" cy="15" r="4" fill="#00F7A7" />
      <text x="56" y="20" text-anchor="middle" class="pill-text">xUnit / QA</text>
    </g>
  </g>

  <!-- Interactive Right-side Cyber Terminal Mockup -->
  <g transform="translate(745, 65)">
    <!-- Terminal Box -->
    <rect width="145" height="135" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <rect width="145" height="135" rx="12" fill="none" stroke="url(#mintSky)" stroke-width="1" opacity="0.6" />

    <!-- Terminal header bar -->
    <rect width="145" height="26" rx="12" fill="#0f172a" />
    <circle cx="16" cy="13" r="3.5" fill="#ef4444" />
    <circle cx="28" cy="13" r="3.5" fill="#f59e0b" />
    <circle cx="40" cy="13" r="3.5" fill="#10b981" />
    <text x="65" y="16" class="mono-accent" font-size="9">bash ~ jeff</text>

    <!-- Code lines with animations -->
    <g transform="translate(14, 42)">
      <!-- Prompt line 1 -->
      <text x="0" y="8" class="badge-text" font-size="10">$ dotnet build</text>
      <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">✓ Build 0 Errors</text>

      <!-- Prompt line 2 -->
      <text x="0" y="38" class="badge-text" font-size="10">$ test-runner</text>
      <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">✓ 48 Tests Passed</text>

      <!-- Status prompt line 3 -->
      <text x="0" y="68" class="badge-text" font-size="10">$ deploy --live</text>
      <rect x="0" y="74" width="70" height="3" rx="1.5" fill="#00F7A7">
        <animate attributeName="width" values="10;115;115" dur="3s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
